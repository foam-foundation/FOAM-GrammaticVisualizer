<!-- ui-statechart page template. Copy to ignored/spikes/<name>/index.html, replace NAME and the class id. -->
<html>
 <head>
  <meta charset="utf-8">
  <!-- project= REPLACES the default pom (foam3/src/foam.js:80): list foam3's pom first, then the skill's fsm-pom (says where foam.FSM lives), then any app poms the view needs; comma-separated, paths relative to THIS html file. -->
  <script language="javascript" src="../../../foam3/src/foam.js" project="../../../foam3/src/pom,../../../.claude/skills/ui-statechart/references/fsm-pom"></script>
  <!-- diagrams (delete these two lines if the spike draws none) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral", state: { useMaxWidth: false } });</script>
  <script src="../../../.claude/skills/ui-statechart/references/spike-diagram.js"></script>
  <!-- the shell every design spike mounts its design in: control strip, design, tabs (usage at the top of the file) -->
  <script src="../../../.claude/skills/ui-statechart/references/spike-shell.js"></script>
  <script language="javascript" src="SpikeView.js"></script>
  <title>SPIKE: NAME (throwaway)</title>
  <meta name="description" content="ONE LINE: what question this page answers">
  <meta name="spec" content="spec.md in this folder, or one plain sentence naming the source">  <!-- what the page is based on: the spec section holding the decisions, or one plain sentence; the spikes index shows it as "Based on:" -->
  <style>
    /* colours come from spike-shell.js tokens (--sp-bg, --sp-text, …), light and dark; never hardcode a hex here */
    body { font-family: sans-serif; margin: 12px 16px; }
    .spike-status { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* FSMDiagramView prints its layout-tuning form above the SVG; hide it. Delete this rule if you want the knobs. */
    .foam-u2-DetailView { display: none; }
    /* ...and its "Improve Layout" button. */
    .spike-fsm > div > button { display: none; }
  </style>
 </head>
 <body>
   <h3>SPIKE: NAME — throwaway, not for merge. Hard-reload (Cmd+Shift+R) after every edit.</h3>
   <foam class="fsmstudio.NAMEView"></foam>
 </body>
</html>
